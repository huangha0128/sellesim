packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  core-js-pure: true
  esbuild: true
  prisma: true

shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

overrides:
  '@babel/types': 7.29.7
  '@babel/generator': 7.29.7
  '@babel/traverse': 7.29.7
  '@babel/core': 7.29.0
  vue: 3.4.21
  vue-router: 4.4.4
