# ===== YYeSim 一键部署 =====
# 使用：docker compose up -d --build
# 访问：
#   - 管理后台：http://<服务器IP>:80/backend/
#   - 后端 API：http://<服务器IP>:6501/api/...（或通过 Caddy /api/）
#   - 直连后台：http://<服务器IP>:6500/backend/（绕过 Caddy）
# 配置：复制 .env.example 为 .env 后按需修改

name: sellsim

services:
  # ---------- 后端 API（Express + Prisma + SQLite）----------
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: sellsim-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PORT: "6660"
      # JWT 签名密钥（生产环境务必在 .env 中修改）
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      # ---- Tiger eSIM 真实下发（可选，留空则本地模拟下发）----
      TIGER_CLIENT_ID: ${TIGER_CLIENT_ID:-}
      TIGER_CLIENT_SECRET: ${TIGER_CLIENT_SECRET:-}
      TIGER_BASE_URL: ${TIGER_BASE_URL:-https://partner.tigeresims.com}
      TIGER_SMDP_ADDRESS: ${TIGER_SMDP_ADDRESS:-}
      TIGER_ICCIDS: ${TIGER_ICCIDS:-}
      # ---- SMTP 邮件通知（支付成功/退款时向用户邮箱发送邮件）----
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-YYeSim}
      # ---- 支付宝小程序 JSAPI 支付配置（必需，否则支付不可用）----
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_HOST: ${ALIPAY_NOTIFY_HOST:-}
    ports:
      - "${SERVER_PORT:-6501}:6660"
    volumes:
      # 只持久化 SQLite 数据库文件，避免卷遮蔽镜像内的 schema.prisma
      - sellsim-data:/app/apps/server/prisma/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6660/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- 管理后台（Vue3 构建产物 + nginx）----------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: sellsim-admin
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-6500}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/backend/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Caddy 反向代理（/backend → 后台，/api → 后端）----------
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: sellsim-caddy
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      # 配置域名（如 www.example.com）后启用 HTTPS（使用手动生成的证书）；留空则监听 80 端口纯 HTTP
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
      # 手动证书在容器内的路径（由 CERT_DIR 挂载）
      CADDY_CERT_FILE: ${CADDY_CERT_FILE:-}
      CADDY_KEY_FILE: ${CADDY_KEY_FILE:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # 挂载手动生成的证书目录（certbot 生成，宿主机路径通过 CERT_DIR 配置）
      - ${CERT_DIR:-/serve/nginx/cert}:/etc/caddy/cert:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sellsim-data:
  caddy-data:
  caddy-config:
