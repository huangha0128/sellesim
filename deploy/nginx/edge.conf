# ============================================================
# 老服（edge）nginx 出口站点配置模板
# 用途：老服作为备案域名出口节点，对 /api 在两个后端间做负载均衡，
#       并把官网(/) 与后台(/backend) 转发到主服（新服）。
# 适配：宝塔面板 → 网站 → nginx 站点配置，或手写 /etc/nginx/conf.d 站点。
# 需替换的占位符：
#   <域名>           你的备案域名，如 www.bjyyxx.com
#   <主服公网IP>     主服（新服）公网 IP；主服用 Caddy 在 80 端口出口
#   <证书路径>       你的 SSL 证书路径（老服现有备案证书）
#   <私钥路径>       你的 SSL 私钥路径
# 前提：
#   1) 老服后端容器已就绪，监听 127.0.0.1:6501（docker compose.edge.yml 已起）。
#   2) 主服 Caddy 已监听 80，且新服安全组允许老服 IP 访问 MySQL 1513 与 80 端口。
# 提示：本文件由 deploy.sh 输出指引，不会自动覆盖已备案站点，请手动合并。
# ============================================================

upstream yyesim_backend {
    # 老服本地后端
    server 127.0.0.1:6501;
    # 主服后端（经由主服 Caddy 的 80 端口）
    server <主服公网IP>:80;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name <域名>;

    ssl_certificate     <证书路径>;
    ssl_certificate_key <私钥路径>;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 均衡头：透传真实客户端信息给后端
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 后端核心 API：在两台后端间负载均衡
    location /api/ {
        proxy_pass http://yyesim_backend;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 开放平台公开文档（免鉴权），同样均衡到后端
    location /open-api/ {
        proxy_pass http://yyesim_backend;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 管理后台：仅主服承载，转发到主服 Caddy
    location /backend {
        proxy_pass http://<主服公网IP>;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 官网静态站：仅主服承载，转发到主服 Caddy
    location / {
        proxy_pass http://<主服公网IP>;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}