# ===== YYeSim 管理后台 nginx 配置 =====
# 服务目录：/usr/share/nginx/html/backend（构建产物）
# 路由：/backend 路径下 SPA，/api 反向代理到后端 server

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /backend → /backend/ 跳转
    location = /backend {
        return 301 /backend/;
    }

    # 后台 SPA（history 模式回退到 index.html）
    location /backend/ {
        try_files $uri /backend/index.html;
    }

    # 反向代理 API（直连本服务 6500 端口时可用）
    location /api/ {
        proxy_pass http://server:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
