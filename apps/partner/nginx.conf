# ===== YYeSim 伙伴门户 nginx 配置 =====
# 服务目录：/usr/share/nginx/html/partner（构建产物）
# 路由：/partner 路径下 SPA，/api 反向代理到后端 server

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /partner → /partner/ 跳转
    location = /partner {
        return 301 /partner/;
    }

    # 伙伴门户 Next.js 静态导出（目录式 index.html，无需 SPA 回退）
    location /partner/ {
        try_files $uri $uri/index.html =404;
    }

    # 反向代理 API（直连本服务端口时可用）
    location /api/ {
        proxy_pass http://server:6660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}